<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found \u2014 Ekagro</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial,sans-serif;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eef1f8;color:#1a1d29;text-align:center;padding:24px;}
  .card{max-width:420px;}
  .mark{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#5b5ff0,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:800;margin:0 auto 24px;}
  h1{font-size:64px;font-weight:800;color:#5b5ff0;margin-bottom:8px;}
  h2{font-size:20px;font-weight:700;margin-bottom:12px;}
  p{color:#6b7280;font-size:15px;line-height:1.5;margin-bottom:28px;}
  a{display:inline-block;background:linear-gradient(135deg,#5b5ff0,#8b5cf6);color:#fff;text-decoration:none;padding:12px 28px;border-radius:14px;font-weight:700;font-size:14px;}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">E</div>
    <h1>404</h1>
    <h2>This page doesn't exist</h2>
    <p>The link you followed might be broken, or the page may have moved. Let's get you back to your tasks.</p>
    <a href="/">Back to Ekagro</a>
  </div>
</body>
</html>
